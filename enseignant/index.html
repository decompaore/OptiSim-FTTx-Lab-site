<meta charset="utf-8">

<title>OptiSim FTTx Lab — accès enseignant</title>
<style>
  :root { --bg:#0b1220; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a44; --brand:#22c55e; --btn:#0369a1; --err:#f87171; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#475569; --line:#cbd5e1; --err:#b91c1c; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:min(420px, 100%); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 26px; box-shadow:0 10px 30px #0004; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand b { font-size:18px; display:block; } .brand small { color:var(--muted); }
  h1 { font-size:17px; margin:0 0 4px; } p { margin:0 0 14px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; margin:12px 0 6px; }
  input[type=password] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; }
  .check { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
  button { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--btn); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:14px; min-height:1.5em; margin:10px 0 0; }
  .foot { margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
