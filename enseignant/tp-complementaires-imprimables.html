<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OptiSim FTTx Lab — accès enseignant</title>
<style>
  :root { --bg:#0b1220; --card:#111a2e; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a44; --brand:#22c55e; --btn:#0369a1; --err:#f87171; }
  @media (prefers-color-scheme: light) { :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#475569; --line:#cbd5e1; --err:#b91c1c; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:min(420px, 100%); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 26px; box-shadow:0 10px 30px #0004; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand b { font-size:18px; display:block; } .brand small { color:var(--muted); }
  h1 { font-size:17px; margin:0 0 4px; } p { margin:0 0 14px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; margin:12px 0 6px; }
  input[type=password] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); font:inherit; }
  .check { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
  button { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--btn); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--err); font-size:14px; min-height:1.5em; margin:10px 0 0; }
  .foot { margin-top:18px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>

  function forget() { try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (e) { /* stockage indisponible */ } }
  function open(key) {
    var p = DATA.split('.');
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p[0]) }, key, b64(p[1])).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function show(html) {
    window.OptiAuth = { logout: function () { forget(); location.reload(); } };
    document.open(); document.write(html); document.close();
    if (location.hash) setTimeout(function () { var e = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (e) e.scrollIntoView(); }, 80);
  }
  var s = stored();
  if (s) {
    crypto.subtle.importKey('raw', b64(s.key), 'AES-GCM', false, ['decrypt']).then(open).then(show).catch(forget);
  }
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('go').disabled = true; $('err').textContent = '';
    var keep = $('keep').checked;
    crypto.subtle.importKey('raw', new TextEncoder().encode($('mdp').value), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']); })
      .then(function (key) {
        return open(key).then(function (html) {
          return crypto.subtle.exportKey('raw', key).then(function (raw) {
            var o = JSON.stringify({ salt: SALT, key: tob64(raw), exp: Date.now() + (keep ? 12 : 4) * 3600 * 1000 });
            try { (keep ? localStorage : sessionStorage).setItem(STORE, o); } catch (e) { /* stockage indisponible */ }
            show(html);
          });
        });
      })
      .catch(function () { $('go').disabled = false; $('err').textContent = 'Mot de passe incorrect.'; $('mdp').select(); });
  });
})();
